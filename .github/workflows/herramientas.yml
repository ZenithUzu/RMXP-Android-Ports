name: Probar herramienta de PC
on:
  push:
    branches: [main]
    paths:
      - tools/**
      - tests/**
      - .github/workflows/herramientas.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
