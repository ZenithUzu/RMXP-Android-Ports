name: Probar herramienta de PC
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Preparar vista de escritorio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk xvfb
          python -m pip install pillow
      - name: Probar distribución de la ventana
        env:
          PORTEMON_UI_PREVIEW: capturas-pc
        run: xvfb-run -a python tests/test_desktop_ui.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portemon-pc-ui
          path: capturas-pc
  limpieza-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar conservación de archivos y bloqueo entre procesos
        run: python -m unittest discover -s tests -p test_cleanup.py -v
