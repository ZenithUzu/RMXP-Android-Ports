# Compila el motor (mkxp-z + Ruby + SDL para Android) y lo publica como
# "motor-android.zip" en una versión (release) del repo. La herramienta de
# Windows (tools/rmxp_port.py) lo descarga, así nadie necesita compilar C++.
name: Motor de Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nombre de la versión (debe coincidir con MOTOR_VERSION en tools/rmxp_port.py)"
        required: true
        default: "motor-v1"

permissions:
  contents: write

jobs:
  motor:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # El Ruby de Ubuntu instala gemas en /var/lib/gems (sin permiso); este no
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Instalar SDK, NDK y fuentes de dependencias
        run: bash tools/setup.sh

      - name: Compilar el motor (arm64-v8a y armeabi-v7a)
        run: bash tools/build.sh --solo-motor

      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" build/motor-android.zip \
            --title "Motor de Android (${{ inputs.version }})" \
            --notes "Librerías del motor compiladas desde el commit ${{ github.sha }} por GitHub Actions. La herramienta (Portar.bat) las descarga sola; no hace falta bajarlas a mano. Código fuente: este mismo repositorio (GPL-2.0-or-later)." \
            || gh release upload "${{ inputs.version }}" build/motor-android.zip --clobber

      # La plantilla para la app del teléfono (RPGMK-AndroidPort-Apk) con este mismo motor.
      # Se publica como "plantilla-ultima"; la app la toma en su próxima compilación.
      - name: Plantilla para el teléfono
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/motor && unzip -q android/build/motor-android.zip -d /tmp/motor
          python3 tools/rmxp_port.py --plantilla --motor /tmp/motor/lib
          cp "$HOME/RMXP-Android-Ports/apks/Plantilla v1.apk" plantilla.apk
          gh release delete plantilla-ultima --yes --cleanup-tag || true
          gh release create plantilla-ultima plantilla.apk --title "plantilla-ultima" \
            --notes "Motor ${{ inputs.version }} sin juego, para RPGMK-AndroidPort-Apk. Hecho de ${GITHUB_SHA::7}."
