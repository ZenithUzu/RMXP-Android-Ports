# Compila el motor (mkxp-z + Ruby + SDL para Android) y lo publica como
# "motor-android.zip" en una versión (release) del repo. La herramienta de
# Windows (tools/rmxp_port.py) lo descarga, así nadie necesita compilar C++.
name: Motor de Android

on:
  push:
    branches: [main]
    paths:
      - android/app/jni/**
      - android/tools/**
  workflow_dispatch:
    inputs:
      version:
        description: "Nombre de la versión (debe coincidir con MOTOR_VERSION en tools/rmxp_port.py)"
        required: true
        default: "motor-v11"

permissions:
  contents: write

jobs:
  motor:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Elegir version del motor
        working-directory: .
        env:
          PEDIDA: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import ast, os, re
          tree = ast.parse(open('tools/rmxp_port.py', encoding='utf-8').read())
          version = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign)
                         and any(isinstance(t, ast.Name) and t.id == 'MOTOR_VERSION' for t in n.targets))
          version = os.environ.get('PEDIDA') or version
          if not re.fullmatch(r'motor-v\d+', version):
              raise ValueError('Version de motor invalida')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('MOTOR_RELEASE=' + version + '\n')
          PY

      # El Ruby de Ubuntu instala gemas en /var/lib/gems (sin permiso); este no
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Instalar SDK, NDK y fuentes de dependencias
        run: bash tools/setup.sh

      - name: Compilar el motor (arm64-v8a y armeabi-v7a)
        run: bash tools/build.sh --solo-motor

      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$MOTOR_RELEASE" build/motor-android.zip \
            --title "Motor de Android ($MOTOR_RELEASE)" \
            --notes "Librerías del motor compiladas desde el commit ${{ github.sha }} por GitHub Actions. La herramienta (Portar.bat) las descarga sola; no hace falta bajarlas a mano. Código fuente: este mismo repositorio (GPL-2.0-or-later)." \
            || gh release upload "$MOTOR_RELEASE" build/motor-android.zip --clobber

      # La Action Plantilla para el teléfono publica plantilla-ultima al completar este flujo.
