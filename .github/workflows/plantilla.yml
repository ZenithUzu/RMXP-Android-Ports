# Arma la "plantilla": el APK del motor sin juego, para la app del teléfono
# (RPGMK-AndroidPort-Apk). Se publica como "plantilla.apk" en una versión del repo.
name: Plantilla para el teléfono

on:
  push:
    branches: [main]
    paths:
      - android/app/src/**
      - android/uitest/**
      - android/settings.gradle
      - android/app/build.gradle
      - android/patches/**
      - .github/scripts/probar-interfaz.sh
      - .github/workflows/plantilla.yml
  workflow_run:
    workflows: [Motor de Android]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Nombre de la versión (la app del teléfono la pide por este nombre)"
        required: true
        default: "plantilla-ultima"

permissions:
  contents: write

concurrency:
  group: plantilla-main
  cancel-in-progress: true

jobs:
  plantilla:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Esperar el motor publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          motor=$(python3 - <<'PYTHON'
          import ast
          tree = ast.parse(open('tools/rmxp_port.py', encoding='utf-8').read())
          print(next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign)
                     and any(isinstance(t, ast.Name) and t.id == 'MOTOR_VERSION' for t in n.targets)))
          PYTHON
          )
          for intento in $(seq 1 180); do
            if gh release view "$motor" --json assets --jq '.assets[].name' | grep -qx motor-android.zip; then exit 0; fi
            echo "Esperando $motor ($intento/180)..."
            sleep 10
          done
          echo "El motor no se publicó a tiempo"; exit 1
      - name: Armar la plantilla (descarga el motor de MOTOR_VERSION)
        run: |
          chmod +x android/gradlew
          python3 tools/rmxp_port.py --plantilla
          cp "$HOME/RMXP-Android-Ports/apks/Plantilla v1.apk" plantilla.apk
          python3 - <<'PY'
          import ast, os
          tree = ast.parse(open('tools/rmxp_port.py', encoding='utf-8').read())
          motor = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign)
                       and any(isinstance(t, ast.Name) and t.id == 'MOTOR_VERSION' for t in n.targets))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('MOTOR_RELEASE=' + motor + '\n')
          PY
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          PLANTILLA_RELEASE: ${{ inputs.version || 'plantilla-ultima' }}
        run: |
          gh release delete "$PLANTILLA_RELEASE" --yes --cleanup-tag || true
          gh release create "$PLANTILLA_RELEASE" plantilla.apk --title "$PLANTILLA_RELEASE" \
            --notes "Motor $MOTOR_RELEASE sin juego, para RPGMK-AndroidPort-Apk. Hecho de ${GITHUB_SHA::7}."
