# Arma la "plantilla": el APK del motor sin juego, para la app del teléfono
# (RPGMK-AndroidPort-Apk). Se publica como "plantilla.apk" en una versión del repo.
name: Plantilla para el teléfono

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nombre de la versión (la app del teléfono la pide por este nombre)"
        required: true
        default: "plantilla-v1"

permissions:
  contents: write

jobs:
  plantilla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Armar la plantilla (descarga el motor de MOTOR_VERSION)
        run: |
          chmod +x android/gradlew
          python3 tools/rmxp_port.py --plantilla
          cp "$HOME/RMXP-Android-Ports/apks/Plantilla v1.apk" plantilla.apk
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ inputs.version }}" --yes --cleanup-tag || true
          gh release create "${{ inputs.version }}" plantilla.apk --title "${{ inputs.version }}" \
            --notes "APK del motor sin juego, para RPGMK-AndroidPort-Apk. Hecho de ${GITHUB_SHA::7}."
