name: Validar renderizado de texto

on:
  workflow_dispatch:
  pull_request:
    paths:
      - android/app/jni/mkxp-z/src/display/bitmap.cpp
      - tests/test_bitmap_text_failures.py
      - .github/workflows/validar-texto.yml

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Probar fallos de SDL
        run: python3 tests/test_bitmap_text_failures.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar dependencias de Android
        working-directory: android
        run: bash tools/setup.sh
      - name: Compilar motor para ambas arquitecturas
        working-directory: android
        run: bash tools/build.sh --solo-motor
      - name: Armar plantilla de prueba
        run: |
          mkdir -p /tmp/motor-texto
          unzip -q android/build/motor-android.zip -d /tmp/motor-texto
          python3 tools/rmxp_port.py --plantilla --motor /tmp/motor-texto/lib
          cp "$HOME/RMXP-Android-Ports/apks/Plantilla v1.apk" plantilla-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: motor-texto-prueba
          path: |
            android/build/motor-android.zip
            plantilla-prueba.apk
